app:
  description: Credit Card Fraud Detection Pipeline with Risk Scoring and Rules
  icon: 💳
  icon_background: '#FFE6E6'
  mode: workflow
  name: Credit Card Fraud Detection Tool
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    retrieval_resource:
      enabled: false
  graph:
    edges:
      - id: start-to-llm
        source: start
        target: llm_fraud_analyzer
      - id: llm-to-code
        source: llm_fraud_analyzer
        target: parse_risk_score
      - id: code-to-if
        source: parse_risk_score
        target: risk_decision_node
      - id: if-to-end-low
        source: risk_decision_node
        target: end_approve
        sourceHandle: low_risk
      - id: if-to-end-high
        source: risk_decision_node
        target: end_review
        sourceHandle: high_risk
    nodes:
      - id: start
        title: Transaction Input
        type: start
        position:
          x: 80
          y: 200
        variables:
          - label: Transaction ID
            max_length: 64
            options: []
            required: true
            type: text-input
            variable: transaction_id
          - label: Amount (USD)
            max_length: 20
            options: []
            required: true
            type: number
            variable: amount
          - label: Merchant Name
            max_length: 100
            options: []
            required: true
            type: text-input
            variable: merchant_name
          - label: Cardholder Home Country
            max_length: 50
            options: []
            required: true
            type: text-input
            variable: user_country
          - label: Transaction Country
            max_length: 50
            options: []
            required: true
            type: text-input
            variable: txn_country
          - label: Device Fingerprint Distance (0-100)
            max_length: 10
            options: []
            required: false
            type: number
            variable: device_risk_score

      - id: llm_fraud_analyzer
        title: LLM Risk Assessment
        type: llm
        position:
          x: 380
          y: 200
        model:
          provider: openai
          name: gpt-4o
          mode: chat
          completion_params:
            temperature: 0.1
        prompt_template:
          - role: system
            text: |
              You are a financial risk analysis system specializing in real-time credit card fraud detection.
              Analyze the input transaction and provide a risk score (0 to 100) and a concise reasoning breakdown.
              
              OUTPUT RULES:
              Respond strictly in valid JSON format without markdown code fences:
              {
                "risk_score": <number between 0 and 100>,
                "risk_level": "<LOW | MEDIUM | HIGH | CRITICAL>",
                "action": "<APPROVE | REVIEW | BLOCK>",
                "reasons": ["<reason 1>", "<reason 2>"]
              }
          - role: user
            text: |
              Analyze this credit card transaction:
              - Transaction ID: {{#start.transaction_id#}}
              - Amount: ${{#start.amount#}}
              - Merchant: {{#start.merchant_name#}}
              - User Home Country: {{#start.user_country#}}
              - Transaction Location: {{#start.txn_country#}}
              - Device Risk Score: {{#start.device_risk_score#}}

      - id: parse_risk_score
        title: Parse Output
        type: code
        position:
          x: 680
          y: 200
        code_language: python3
        code: |
          import json

          def main(llm_output: str) -> dict:
              clean_output = llm_output.strip().replace("```json", "").replace("```", "")
              try:
                  data = json.loads(clean_output)
                  return {
                      "risk_score": int(data.get("risk_score", 50)),
                      "action": str(data.get("action", "REVIEW")),
                      "reasons": ", ".join(data.get("reasons", [])),
                      "parsed_json": data
                  }
              except Exception as e:
                  return {
                      "risk_score": 90,
                      "action": "REVIEW",
                      "reasons": f"Failed to parse LLM response format: {str(e)}",
                      "parsed_json": {}
                  }
        variables:
          - variable: llm_output
            value_selector:
              - llm_fraud_analyzer
              - text

      - id: risk_decision_node
        title: Branch by Risk
        type: if-else
        position:
          x: 980
          y: 200
        logical_operator: and
        conditions:
          - id: low_risk
            comparison_operator: less_than
            variable_selector:
              - parse_risk_score
              - risk_score
            value: "70"

      - id: end_approve
        title: Approve Transaction
        type: end
        position:
          x: 1280
          y: 100
        outputs:
          - variable: status
            value_selector:
              - parse_risk_score
              - action
          - variable: risk_score
            value_selector:
              - parse_risk_score
              - risk_score
          - variable: summary
            value_selector:
              - parse_risk_score
              - reasons

      - id: end_review
        title: Flag for Manual Review / Block
        type: end
        position:
          x: 1280
          y: 300
        outputs:
          - variable: status
            value_selector:
              - parse_risk_score
              - action
          - variable: risk_score
            value_selector:
              - parse_risk_score
              - risk_score
          - variable: summary
            value_selector:
              - parse_risk_score
              - reasons